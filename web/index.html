<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="assets/style.css">

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Antiphishing Threat Intelligence Panel | Suricata</title>

  <meta name="description"
    content="Antiphishing Threat Intelligence Panel: consulta e visualização de indicadores e regras Suricata relacionados a phishing, com detecção por DNS, TLS e HTTP.">

  <meta name="keywords"
    content="Antiphishing, Suricata, Threat Intelligence, CTI, phishing, cybersecurity, cyber security, IDS, IPS, DNS, TLS, HTTP, IOCs, threat detection, network security, open source">

  <meta name="author" content="Julio Lira">

  <meta name="robots" content="index, follow, max-image-preview:large">

  <meta name="googlebot" content="index, follow, max-image-preview:large">

  <link rel="canonical" href="https://julioliraup.github.io/AT/">

  <!-- Theme -->
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph / LinkedIn / Facebook -->
  <meta property="og:type" content="website">

  <meta property="og:title" content="Antiphishing Threat Intelligence Panel | Suricata">

  <meta property="og:description"
    content="Public Threat Intelligence dashboard for the Antiphishing project, providing visibility into phishing indicators and Suricata detection rules across DNS, TLS and HTTP.">

  <meta property="og:url" content="https://julioliraup.github.io/AT/">

  <meta property="og:site_name" content="Antiphishing">

  <meta property="og:image" content="https://github.com/julioliraup/Antiphishing/raw/main/img/antiphishing.png">

  <meta property="og:image:alt" content="Antiphishing Threat Intelligence Panel">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- X / Twitter -->

  <meta name="twitter:title" content="Antiphishing Threat Intelligence Panel | Suricata">

  <meta name="twitter:description"
    content="Threat Intelligence and Suricata detection rules for phishing across DNS, TLS and HTTP.">

  <meta name="twitter:image" content="https://github.com/julioliraup/Antiphishing/raw/main/img/antiphishing.png">

  <meta name="twitter:image:alt" content="Antiphishing Threat Intelligence Panel">

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Antiphishing Threat Intelligence Panel",
    "alternateName": "Antiphishing AT",
    "description": "Public Threat Intelligence interface for the Antiphishing project, providing visualization and search of phishing indicators and Suricata detection rules.",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Web",
    "url": "https://julioliraup.github.io/AT/",
    "codeRepository": "https://github.com/julioliraup/AT",
    "author": {
      "@type": "Person",
      "name": "Julio Lira",
      "url": "https://julioliraup.github.io/"
    },
    "isPartOf": {
      "@type": "SoftwareApplication",
      "name": "Antiphishing",
      "url": "https://github.com/julioliraup/Antiphishing"
    },
    "license": "https://www.gnu.org/licenses/gpl-3.0.html"
  }
  </script>
</head>

<body>
  <div class="container">
    <div style="margin-bottom: 20px;">
      <a href="https://github.com/julioliraup/Antiphishing/raw/refs/heads/main/antiphishing.tar.gz" class="back-btn"
        style="font-size: 12px;">&#x2B73; Download ruleset</a>
    </div>
    <div
      style="display: flex; align-items: center; justify-content: center; gap: 20px; flex-direction: column; margin-bottom: 30px;">
      <img src="https://github.com/julioliraup/Antiphishing/raw/main/img/antiphishing.png" alt="Antiphishing Logo"
        style="max-height: 220px;">
      <h1 class="glitch" data-text="ANTIPHISHING PANEL" style="margin:0; text-align: center;">ANTIPHISHING PANEL</h1>
    </div>

    <div class="card glow"
      style="text-align: center; margin-bottom: 40px; color: var(--text-muted); border-top: 2px solid var(--cyan);">
      <p style="margin: 0; font-size: 1.1em;"><a href="https://github.com/julioliraup/Antiphishing" target="_blank"
          style="color: var(--cyan); text-decoration: none; font-weight: bold; text-shadow: 0 0 10px rgba(0,229,255,0.5);">julioliraup/antiphishing</a>
        is a free software project providing Suricata rules, frequently updated with phishing threat vectors.</p>
    </div>

    <div class="search-container">
      <input id="search" placeholder="Query url or sid...">
    </div>

    <div id="dynamic-view">
      <!-- Default state: Visualizers -->
      <div id="stats-widget" class="stats-grid"></div>
      <!-- Search state: Cards -->
      <div id="cards" class="grid-2" style="display: none;"></div>
    </div>

    <footer
      style="margin-top: 60px; padding-top: 20px; border-top: 1px dashed var(--border); text-align: center; color: var(--text-muted); font-size: 0.9em; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-family: 'Orbitron', sans-serif;">
      <a href="https://github.com/julioliraup/AT/blob/main/LICENSE" target="_blank"
        style="color: var(--cyan); text-decoration: none; transition: 0.3s;"
        onmouseover="this.style.color='var(--neon-pink)'" onmouseout="this.style.color='var(--cyan)'">[ License: GPL-v3
        ]</a>
      <a href="https://github.com/julioliraup/AT" target="_blank"
        style="color: var(--cyan); text-decoration: none; transition: 0.3s;"
        onmouseover="this.style.color='var(--neon-pink)'" onmouseout="this.style.color='var(--cyan)'">[ AT on GitHub
        ]</a>
      <a href="https://github.com/julioliraup/Antiphishing" target="_blank"
        style="color: var(--cyan); text-decoration: none; transition: 0.3s;"
        onmouseover="this.style.color='var(--neon-pink)'" onmouseout="this.style.color='var(--cyan)'">[ Project GitHub
        ]</a>
      <a href="https://julioliraup.github.io" target="_blank"
        style="color: var(--cyan); text-decoration: none; transition: 0.3s;"
        onmouseover="this.style.color='var(--neon-pink)'" onmouseout="this.style.color='var(--cyan)'">[ Julio Lira
        (Blog) ]</a>
    </footer>
  </div>
  <script src="assets/app.js"></script>
</body>

</html>
