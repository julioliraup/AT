name: Build and Deploy SIDScope

on:
  push:
    paths:
      - 'rules/**'
      - 'scripts/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build DB
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: |
          echo "OTX_API_KEY=${OTX_API_KEY}" > .env
          python scripts/parse_rules.py rules/antiphishing.rules rules/phishing.lst
          python scripts/build_index.py
          python scripts/validate.py

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
