name: Build and Deploy SIDScope

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      
  workflow_run:
    workflows: ["Sync Antiphishing sources"]
    types: [completed]
    

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate generated SID catalog
        run: python3 scripts/validate.py

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
